<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Sistema de Notas</h1>
        <p>Cadastre o aluno e calcule sua média.</p>

        <form id="formulario">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite o nome">

            <label for="idade">Idade</label>
            <input type="number" id="idade" placeholder="Digite a idade">

            <label for="nota1">Primeira nota</label>
            <input type="number" id="nota1" min="0" max="10"
                step="any" placeholder="Nota de 0 a 10">

            <label for="nota2">Segunda nota</label>
            <input type="number" id="nota2" min="0" max="10"
                step="any" placeholder="Nota de 0 a 10">

            <label for="nota3">Terceira nota</label>
            <input type="number" id="nota3" min="0" max="10"
                step="any" placeholder="Nota de 0 a 10">

            <button type="submit">Calcular média</button>
            <button type="reset" id="limpar">Limpar</button>
        </form>

        <section id="resultado" aria-live="polite"></section>
    </main>

</body>
</html>
